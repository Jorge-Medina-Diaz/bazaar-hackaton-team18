name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Full suite (stdlib only, no key, no network)
        run: python -m unittest discover -s tests -t .
      - name: Sunday rehearsal on the fake server
        run: python -m sim.sunday C 120
